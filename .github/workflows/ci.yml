name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências (com grupo dev)
        run: poetry install --with dev

      - name: Rodar Ruff (lint)
        run: poetry run ruff check .

      - name: Rodar Ruff (format check)
        run: poetry run ruff format --check .

  test:
    name: Pytest (Postgres real)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bookstore
          POSTGRES_PASSWORD: bookstore
          POSTGRES_DB: bookstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookstore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: bookstore_test
      DB_USER: bookstore
      DB_PASSWORD: bookstore
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-dummy-secret-key-nao-usar-em-producao
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependências (com grupo dev)
        run: poetry install --with dev

      - name: Confirmar que o banco é Postgres (trava anti-SQLite)
        run: |
          poetry run python -c "
          from django.conf import settings
          import django
          django.setup()
          engine = settings.DATABASES['default']['ENGINE']
          assert 'postgresql' in engine, f'ERRO: CI rodando em {engine}, esperado Postgres'
          print(f'OK: banco configurado como {engine}')
          "
        env:
          DJANGO_SETTINGS_MODULE: core.settings

      - name: Rodar testes
        run: poetry run pytest -v
  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Buildar imagem (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bookstore:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max